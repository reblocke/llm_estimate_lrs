[project]
name = "llm-estimate-lrs"
version = "1.1.0"
description = "Code and frozen research artifacts for the Scientific Reports study of LLM-generated diagnostic likelihood ratios."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "scikit-learn>=1.4",
  "statsmodels>=0.14",
  "pingouin>=0.5",
  "scienceplots>=2.1",
  "krippendorff>=0.6",
  "python-docx>=1.0",
  "openpyxl>=3.1",
  "python-dotenv>=1.0",
  "pydantic>=2.7",
  "openai>=1.50",
  "papermill>=2.5",
  "jupyterlab>=4.2",
  "ipykernel>=6.29",
  "pillow>=10.0",         # for high-DPI TIFF export
  "beautifulsoup4>=4.12", # if scraping helpers are used
  "requests>=2.31"
]

[project.urls]
Homepage = "https://doi.org/10.1038/s41598-026-61766-2"
Repository = "https://github.com/reblocke/llm_estimate_lrs"
Issues = "https://github.com/reblocke/llm_estimate_lrs/issues"
Article = "https://doi.org/10.1038/s41598-026-61766-2"

[dependency-groups]
dev = [
  "ruff>=0.5",
  "black>=24.4",
  "pre-commit>=3.7",
  "pytest>=8.2",
  "pytest-socket>=0.7",
  "jsonschema>=4.23",
  "pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --disable-socket"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
